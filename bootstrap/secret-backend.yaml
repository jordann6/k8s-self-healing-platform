# ESO's identity toward the backend. On the clouds this is EKS Pod Identity /
# AKS or GKE workload identity; on kind it is a ServiceAccount token scoped by
# RBAC to one Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-backend-reader
  namespace: selfheal
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-backend-reader
  namespace: secret-backend
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [partner-api-key]
    verbs: [get]
  # ESO's store validation asks whether it may read secrets here.
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-backend-reader
  namespace: secret-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-backend-reader
subjects:
  - kind: ServiceAccount
    name: eso-backend-reader
    namespace: selfheal
