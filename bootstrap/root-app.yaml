# App of apps. Its path (apps/<profile>) is the profile switch: the runner
# patches this one field, and everything in the lab namespace follows from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selfheal-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://gitserver.gitops.svc.cluster.local/lab.git
    targetRevision: main
    path: apps/baseline
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
