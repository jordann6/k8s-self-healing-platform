# Local gates. These run before a commit exists, which is the only point where
# a secret is still cheap to remove. CI re-runs the same checks because local
# hooks can be skipped with --no-verify.
#
# Install:  pre-commit install && pre-commit install --hook-type pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      # Evidence is committed byte-for-byte as recorded; the secret and
      # private-key hooks below still scan it.
      - id: end-of-file-fixer
        exclude: ^evidence/
      - id: trailing-whitespace
        exclude: ^evidence/
      - id: check-yaml
        # Kubernetes manifests are multi-document YAML.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact
          # Terraform only (the manifests are rendered and checked by make
          # check). The only accepted finding is CKV_TF_1, registry modules
          # pinned by version range rather than commit hash, the same
          # exception infra/aws/.checkov.baseline records for CI.
          - --args=--framework terraform
          - --args=--skip-check CKV_TF_1
          # Downloaded registry modules are scanned upstream, not here.
          - --args=--skip-path .terraform

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
