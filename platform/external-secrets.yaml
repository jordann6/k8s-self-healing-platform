installCRDs: true
serviceMonitor:
  enabled: true
resources:
  requests: {cpu: 20m, memory: 64Mi}

# Only SecretStore + ExternalSecret are used. Every other CRD family is schema
# the API server would hold in memory for nothing (ESO 2.x ships ~25 large CRDs:
# 1.98 MB of schema, 0.95 MB after this trim).
crds:
  createClusterExternalSecret: false
  createClusterSecretStore: false
  createClusterGenerator: false
  createClusterPushSecret: false
  createPushSecret: false
# ...and the controllers for them, which otherwise crash on the missing kinds
# ("no matches for kind PushSecret").
processClusterExternalSecret: false
processClusterPushSecret: false
processClusterStore: false
processClusterGenerator: false
processPushSecret: false

# The webhook only validates ExternalSecret/SecretStore objects (these CRDs
# have no conversion webhook); Argo CD's dry-run and the API schema cover that
# here. Dropping it and its cert controller saves two processes.
webhook:
  create: false
certController:
  create: false
