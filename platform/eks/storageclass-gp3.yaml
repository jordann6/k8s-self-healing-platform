# The EBS CSI driver's gp3 class for row D1 (ADR-0022 decision 6). EKS ships no CSI driver
# and the default gp2 class uses the in-tree provisioner, so D1's PostgreSQL volumes use this
# one. WaitForFirstConsumer keeps the volume in the pod's zone, the volume is encrypted, and it
# is deliberately not the default class so no other workload is moved onto it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
