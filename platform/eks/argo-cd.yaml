# EKS overrides on top of ../argo-cd.yaml: the same watch list plus the
# Karpenter NodePool, which is part of each profile on EKS (its disruption
# budget is part of what rows A4 and S5 compare). Lists replace, so the whole
# list is repeated.
configs:
  cm:
    resource.inclusions: |
      - apiGroups: [""]
        kinds: [Service, Pod]
        clusters: ["*"]
      - apiGroups: [apps]
        kinds: [Deployment, ReplicaSet]
        clusters: ["*"]
      - apiGroups: [autoscaling]
        kinds: [HorizontalPodAutoscaler]
        clusters: ["*"]
      - apiGroups: [policy]
        kinds: [PodDisruptionBudget]
        clusters: ["*"]
      - apiGroups: [argoproj.io]
        kinds: [Application, Rollout, AnalysisTemplate, AnalysisRun]
        clusters: ["*"]
      - apiGroups: [cilium.io]
        kinds: [CiliumNetworkPolicy]
        clusters: ["*"]
      - apiGroups: [external-secrets.io]
        kinds: [ExternalSecret, SecretStore]
        clusters: ["*"]
      - apiGroups: [cert-manager.io]
        kinds: [Certificate]
        clusters: ["*"]
      - apiGroups: [monitoring.coreos.com]
        kinds: [PrometheusRule, PodMonitor]
        clusters: ["*"]
      - apiGroups: [karpenter.sh]
        kinds: [NodePool]
        clusters: ["*"]
