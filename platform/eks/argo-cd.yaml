# EKS overrides on top of ../argo-cd.yaml: the same watch list plus the
# Karpenter NodePool, which is part of each profile on EKS (its disruption
# budget is part of what rows A4 and S5 compare). Lists replace, so the whole
# list is repeated. scripts/test_argocd_inclusions.py fails if this list ever
# stops being a superset of the base list.
configs:
  cm:
    resource.inclusions: |
      - apiGroups: [""]
        kinds: [Service, Pod, ConfigMap, PersistentVolumeClaim, ServiceAccount, ResourceQuota, LimitRange]
        clusters: ["*"]
      - apiGroups: [apps]
        kinds: [Deployment, ReplicaSet, StatefulSet]
        clusters: ["*"]
      - apiGroups: [batch]
        kinds: [Job, CronJob]
        clusters: ["*"]
      - apiGroups: [autoscaling]
        kinds: [HorizontalPodAutoscaler]
        clusters: ["*"]
      - apiGroups: [policy]
        kinds: [PodDisruptionBudget]
        clusters: ["*"]
      # O1 manages a namespaced readiness boundary.
      - apiGroups: [rbac.authorization.k8s.io]
        kinds: [Role, RoleBinding]
        clusters: ["*"]
      - apiGroups: [networking.k8s.io]
        kinds: [NetworkPolicy]
        clusters: ["*"]
      - apiGroups: [argoproj.io]
        kinds: [Application, Rollout, AnalysisTemplate, AnalysisRun]
        clusters: ["*"]
      - apiGroups: [cilium.io]
        kinds: [CiliumNetworkPolicy]
        clusters: ["*"]
      - apiGroups: [external-secrets.io]
        kinds: [ExternalSecret, SecretStore]
        clusters: ["*"]
      - apiGroups: [cert-manager.io]
        kinds: [Certificate]
        clusters: ["*"]
      - apiGroups: [monitoring.coreos.com]
        kinds: [PrometheusRule, PodMonitor]
        clusters: ["*"]
      # Row A3 on AKS (KEDA add-on) and row Q1 on kind (KEDA chart): the
      # ScaledObjects, plus Q1's TriggerAuthentication (rare, so cheap to watch).
      - apiGroups: [keda.sh]
        kinds: [ScaledObject, TriggerAuthentication]
        clusters: ["*"]
      # Row Q3 uses recommendation-only VPA. The focused platform installs
      # only the recommender, with no updater or admission controller.
      - apiGroups: [autoscaling.k8s.io]
        kinds: [VerticalPodAutoscaler]
        clusters: ["*"]
      # Row P1 uses the CEL based image policy API. Legacy ClusterPolicy is
      # deprecated in Kyverno 1.19 and is deliberately not used.
      - apiGroups: [policies.kyverno.io]
        kinds: [ImageValidatingPolicy]
        clusters: ["*"]
      - apiGroups: [karpenter.sh]
        kinds: [NodePool]
        clusters: ["*"]
