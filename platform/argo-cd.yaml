# Argo CD for the lab namespace. Dex, notifications and ApplicationSets are
# not used.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # Watch only the kinds the lab deploys. By default the controller caches
    # every resource in the cluster, which on a laptop costs hundreds of MB in
    # the controller and a watch per kind on the API server.
    resource.inclusions: |
      - apiGroups: [""]
        kinds: [Service, Pod, ConfigMap]
        clusters: ["*"]
      - apiGroups: [apps]
        kinds: [Deployment, ReplicaSet]
        clusters: ["*"]
      - apiGroups: [autoscaling]
        kinds: [HorizontalPodAutoscaler]
        clusters: ["*"]
      - apiGroups: [policy]
        kinds: [PodDisruptionBudget]
        clusters: ["*"]
      - apiGroups: [argoproj.io]
        kinds: [Application, Rollout, AnalysisTemplate, AnalysisRun]
        clusters: ["*"]
      - apiGroups: [cilium.io]
        kinds: [CiliumNetworkPolicy]
        clusters: ["*"]
      - apiGroups: [external-secrets.io]
        kinds: [ExternalSecret, SecretStore]
        clusters: ["*"]
      - apiGroups: [cert-manager.io]
        kinds: [Certificate]
        clusters: ["*"]
      - apiGroups: [monitoring.coreos.com]
        kinds: [PrometheusRule, PodMonitor]
        clusters: ["*"]
      # Row A3 on AKS (KEDA add-on) and row Q1 on kind (KEDA chart): the
      # ScaledObjects, plus Q1's TriggerAuthentication (rare, so cheap to watch).
      - apiGroups: [keda.sh]
        kinds: [ScaledObject, TriggerAuthentication]
        clusters: ["*"]
      # Row Q3 uses recommendation-only VPA. The focused platform installs
      # only the recommender, with no updater or admission controller.
      - apiGroups: [autoscaling.k8s.io]
        kinds: [VerticalPodAutoscaler]
        clusters: ["*"]
      # Row P1 uses the CEL based image policy API. Legacy ClusterPolicy is
      # deprecated in Kyverno 1.19 and is deliberately not used.
      - apiGroups: [policies.kyverno.io]
        kinds: [ImageValidatingPolicy]
        clusters: ["*"]
controller:
  resources:
    requests: {cpu: 100m, memory: 192Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 96Mi}
server:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
