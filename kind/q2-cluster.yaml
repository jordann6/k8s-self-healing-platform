# Focused Q2 proving ground. A five-second HPA sync cadence keeps the fixed
# 30-second telemetry-fallback SLO meaningful without changing other rows.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: selfheal
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        configMapAndSecretChangeDetectionStrategy: Watch
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            horizontal-pod-autoscaler-sync-period: 5s
