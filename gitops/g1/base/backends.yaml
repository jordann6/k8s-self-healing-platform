apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: selfheal-g1
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: selfheal-g1:v1
          imagePullPolicy: IfNotPresent
          env:
            - {name: G1_BACKEND, value: web}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: selfheal-g1
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8080
---
