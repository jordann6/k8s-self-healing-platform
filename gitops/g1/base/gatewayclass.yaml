# One class, one proxy configuration. The data plane Service is ClusterIP: no
# load balancer and no public address on kind, and the runner calls it from a
# pod (ADR-0025 decision 1).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: g1
  namespace: selfheal-g1-platform
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 2
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: selfheal-g1
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: g1
    namespace: selfheal-g1-platform
