# Q2 kind-only application. KEDA owns q2-target replicas in both profiles.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selfheal-q2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://gitserver.gitops.svc.cluster.local/lab.git
    targetRevision: main
    path: q2/baseline
  destination:
    server: https://kubernetes.default.svc
    namespace: selfheal
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions: [RespectIgnoreDifferences=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: q2-target
      jsonPointers: [/spec/replicas]
