# Row Q1 (kind only). Hardened reverts drift (selfHeal) like the web workload,
# and ignores the worker's replica count, which KEDA owns from zero.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selfheal-q1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://gitserver.gitops.svc.cluster.local/lab.git
    targetRevision: main
    path: q1/hardened
  destination:
    server: https://kubernetes.default.svc
    namespace: selfheal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  # KEDA owns the worker's replica count; without this, self-heal and the
  # autoscaler would fight over it (the web workload does the same for its HPA).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: qworker
      jsonPointers: [/spec/replicas]
