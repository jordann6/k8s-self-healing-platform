apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selfheal-p1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://gitserver.gitops.svc/lab.git
    targetRevision: main
    path: p1/hardened
  destination:
    server: https://kubernetes.default.svc
    namespace: selfheal-p1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
