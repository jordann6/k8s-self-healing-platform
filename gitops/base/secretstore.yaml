# The backend (namespace secret-backend) through ESO's Kubernetes provider.
# On the clouds this becomes the AWS Secrets Manager / Azure Key Vault / GCP
# Secret Manager provider; the ExternalSecret and everything downstream stay.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: backend
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-backend
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-backend-reader
