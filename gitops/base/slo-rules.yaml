# Generated by `make slo` from slo/web.yaml with Sloth v0.13.0 and the lab
# windows in slo/windows (SRE Workbook windows divided by 12). Do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: selfheal-slo
spec:
  groups:
  - name: sloth-slo-sli-recordings-selfheal-web-availability
    rules:
    - record: slo:sli_error:ratio_rate25s
      expr: |
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/",code=~"5.."}[25s])))
        /
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/"}[25s])))
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 25s
        team: platform
    - record: slo:sli_error:ratio_rate2m30s
      expr: |
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/",code=~"5.."}[2m30s])))
        /
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/"}[2m30s])))
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 2m30s
        team: platform
    - record: slo:sli_error:ratio_rate5m
      expr: |
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/",code=~"5.."}[5m])))
        /
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/"}[5m])))
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 5m
        team: platform
    - record: slo:sli_error:ratio_rate10m
      expr: |
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/",code=~"5.."}[10m])))
        /
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/"}[10m])))
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 10m
        team: platform
    - record: slo:sli_error:ratio_rate30m
      expr: |
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/",code=~"5.."}[30m])))
        /
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/"}[30m])))
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 30m
        team: platform
    - record: slo:sli_error:ratio_rate2h
      expr: |
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/",code=~"5.."}[2h])))
        /
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/"}[2h])))
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 2h
        team: platform
    - record: slo:sli_error:ratio_rate6h
      expr: |
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/",code=~"5.."}[6h])))
        /
        (sum(rate(http_requests_total{namespace="selfheal",container="web",path="/"}[6h])))
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 6h
        team: platform
    - record: slo:sli_error:ratio_rate2d12h
      expr: |
        sum_over_time(slo:sli_error:ratio_rate25s{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"}[2d12h])
        / ignoring (sloth_window)
        count_over_time(slo:sli_error:ratio_rate25s{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"}[2d12h])
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_window: 2d12h
        team: platform
  - name: sloth-slo-meta-recordings-selfheal-web-availability
    rules:
    - record: slo:objective:ratio
      expr: vector(0.995)
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        team: platform
    - record: slo:error_budget:ratio
      expr: vector(1-0.995)
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        team: platform
    - record: slo:time_period:days
      expr: vector(2.5)
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        team: platform
    - record: slo:current_burn_rate:ratio
      expr: |
        slo:sli_error:ratio_rate25s{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"}
        / on(sloth_id, sloth_slo, sloth_service) group_left
        slo:error_budget:ratio{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"}
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        team: platform
    - record: slo:period_burn_rate:ratio
      expr: |
        slo:sli_error:ratio_rate2d12h{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"}
        / on(sloth_id, sloth_slo, sloth_service) group_left
        slo:error_budget:ratio{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"}
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        team: platform
    - record: slo:period_error_budget_remaining:ratio
      expr: 1 - slo:period_burn_rate:ratio{sloth_id="selfheal-web-availability", sloth_service="selfheal-web",
        sloth_slo="availability"}
      labels:
        sloth_id: selfheal-web-availability
        sloth_service: selfheal-web
        sloth_slo: availability
        team: platform
    - record: sloth_slo_info
      expr: vector(1)
      labels:
        sloth_id: selfheal-web-availability
        sloth_mode: cli-gen-prom
        sloth_objective: "99.5"
        sloth_service: selfheal-web
        sloth_slo: availability
        sloth_spec: prometheus/v1
        sloth_version: v0.13.0
        team: platform
  - name: sloth-slo-alerts-selfheal-web-availability
    rules:
    - alert: WebAvailabilityBudgetBurn
      expr: |
        (
            max(slo:sli_error:ratio_rate25s{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (14.4 * 0.005)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate5m{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (14.4 * 0.005)) without (sloth_window)
        )
        or
        (
            max(slo:sli_error:ratio_rate2m30s{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (6 * 0.005)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate30m{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (6 * 0.005)) without (sloth_window)
        )
      labels:
        severity: page
        sloth_severity: page
      annotations:
        runbook_url: docs/runbooks/slo-burn.md
        summary: '{{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn
          rate is over expected.'
        title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
          burn rate is too fast.
    - alert: WebAvailabilityBudgetBurn
      expr: |
        (
            max(slo:sli_error:ratio_rate10m{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (3 * 0.005)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate2h{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (3 * 0.005)) without (sloth_window)
        )
        or
        (
            max(slo:sli_error:ratio_rate30m{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (1 * 0.005)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate6h{sloth_id="selfheal-web-availability", sloth_service="selfheal-web", sloth_slo="availability"} > (1 * 0.005)) without (sloth_window)
        )
      labels:
        severity: ticket
        sloth_severity: ticket
      annotations:
        summary: '{{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn
          rate is over expected.'
        title: (ticket) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
          burn rate is too fast.
