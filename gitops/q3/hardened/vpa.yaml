apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: q3-target
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: q3-target
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: target
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 16Mi}
        maxAllowed: {cpu: "1", memory: 256Mi}
