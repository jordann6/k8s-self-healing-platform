apiVersion: v1
kind: Service
metadata:
  name: q3-target
  labels: {app: q3-target}
spec:
  selector: {app: q3-target}
  ports:
    - {name: http, port: 8082, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: q3-target
spec:
  replicas: 1
  selector:
    matchLabels: {app: q3-target}
  template:
    metadata:
      labels: {app: q3-target}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: target
          image: selfheal-q3
          env:
            - {name: CPU_M, value: "200"}
            - {name: MEMORY_MIB, value: "96"}
          ports:
            - {name: http, containerPort: 8082}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
