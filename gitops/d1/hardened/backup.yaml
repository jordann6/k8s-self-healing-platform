apiVersion: batch/v1
kind: CronJob
metadata:
  name: d1-backup
  namespace: selfheal-d1-source
spec:
  schedule: "0 0 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: {app: d1-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: selfheal-d1-tool:v1
              imagePullPolicy: IfNotPresent
              command: [/usr/local/bin/backup.sh]
              env:
                - {name: POSTGRES_HOST, value: d1-source.selfheal-d1-source.svc.cluster.local}
                - {name: POSTGRES_USER, value: d1}
                - {name: POSTGRES_DB, value: d1}
                - name: POSTGRES_PASSWORD
                  valueFrom: {secretKeyRef: {name: d1-postgres, key: password}}
                - {name: S3_ENDPOINT, value: http://minio.selfheal-d1-store.svc.cluster.local:9000}
                - {name: S3_BUCKET, value: d1-backups}
                - name: S3_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: d1-backup-store, key: access-key}}
                - name: S3_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: d1-backup-store, key: secret-key}}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: work, mountPath: /work}
          volumes:
            - name: work
              emptyDir: {sizeLimit: 256Mi}
