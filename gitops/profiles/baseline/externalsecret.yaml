# ESO's default refresh: a backend rotation reaches the cluster within an hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: partner-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: backend
    kind: SecretStore
  target:
    name: partner-api-key
  data:
    - secretKey: api-key
      remoteRef:
        key: partner-api-key
        property: api-key
