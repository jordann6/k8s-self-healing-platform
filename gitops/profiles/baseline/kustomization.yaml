# Baseline: a typical first deployment. Fixed replicas, no probes, no memory
# limit, an all-at-once rollout, a key synced on ESO's default hourly refresh
# with nothing restarting the pods, a hand-made certificate nobody renews, an
# allow-all network policy, and Argo CD that does not revert drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfheal
resources:
  - ../../base
  - rollout.yaml
  - externalsecret.yaml
  - policy.yaml
images:
  - name: selfheal-app
    newTag: v1
