# Row S2. One-hour certificates renewed 20 minutes before expiry, with a new
# key each time. The web pods reload the mounted pair without a restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-tls
spec:
  secretName: web-tls
  duration: 1h
  renewBefore: 20m
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - web
    - web.selfheal
    - web.selfheal.svc
    - web.selfheal.svc.cluster.local
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
