# Row A3. Lab scale-down window is 30s (production: the 300s default) so the
# next row starts from the minimum.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: web
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        # 70% of the 100m request: scale for latency headroom, not just for
        # saturation. At 100% the HPA settled with every pod at its target and
        # p95 drifted to 750 ms (run 5). Idle prober traffic runs a pod near 40%,
        # so this still holds three pods at rest.
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
        - {type: Pods, value: 4, periodSeconds: 15}
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
