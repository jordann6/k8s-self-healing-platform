apiVersion: v1
kind: LimitRange
metadata:
  name: o1-defaults
  namespace: selfheal-o1
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      default:
        cpu: 200m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: o1-budget
  namespace: selfheal-o1
spec:
  hard:
    pods: "8"
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
