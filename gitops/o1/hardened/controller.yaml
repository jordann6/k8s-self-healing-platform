apiVersion: v1
kind: Service
metadata:
  name: o1-alert-receiver
  namespace: selfheal-o1
spec:
  selector:
    app.kubernetes.io/name: o1-alert-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o1-alert-receiver
  namespace: selfheal-o1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: o1-alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o1-alert-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: selfheal-o1:v1
          imagePullPolicy: Never
          env:
            - name: O1_MODE
              value: receiver
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o1-controller
  namespace: selfheal-o1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: o1-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o1-controller
    spec:
      serviceAccountName: o1-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: selfheal-o1:v1
          imagePullPolicy: Never
          env:
            - name: O1_MODE
              value: controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
