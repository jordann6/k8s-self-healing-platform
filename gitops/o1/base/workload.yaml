apiVersion: v1
kind: ConfigMap
metadata:
  name: o1-profile
  namespace: selfheal-o1
data:
  profile: unset
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o1-evidence
  namespace: selfheal-o1
data: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: o1-target
  namespace: selfheal-o1
  labels:
    app.kubernetes.io/name: o1-target
    o1.security/quarantined: "true"
  annotations:
    o1.security/incident: "false"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: target
      image: selfheal-o1:v1
      imagePullPolicy: Never
      env:
        - name: O1_MODE
          value: target
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 2
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: o1-target
  namespace: selfheal-o1
spec:
  selector:
    app.kubernetes.io/name: o1-target
  ports:
    - name: http
      port: 8080
      targetPort: http
