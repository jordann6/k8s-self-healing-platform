apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: o1-operator
  namespace: selfheal-o1
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: o1-operator
  namespace: selfheal-o1
subjects:
  - kind: ServiceAccount
    name: o1-operator
    namespace: selfheal-o1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: o1-operator
