apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quarantines.selfhealing.lab
spec:
  group: selfhealing.lab
  scope: Namespaced
  names: {plural: quarantines, singular: quarantine, kind: Quarantine, shortNames: [qr]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Pod, type: string, jsonPath: .spec.podName}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [podName, evidenceRef]
              properties:
                podName: {type: string, minLength: 1}
                reason: {type: string}
                evidenceRef: {type: string, minLength: 1}
                release:
                  type: object
                  properties:
                    requestId: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
