# D1 on AKS: the kind baseline without the MinIO store (ADR-0022), on
# AKS's default managed-csi class.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../d1/base
patches:
  - target: {kind: ConfigMap, name: d1-profile}
    patch: |-
      - op: add
        path: /data/profile
        value: baseline
