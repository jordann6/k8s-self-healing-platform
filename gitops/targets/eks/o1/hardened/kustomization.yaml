# O1 on EKS: the kind profile with the registry image and the pull
# policy the cloud needs, pinned to the one labelled system node so a
# replacement controller pulls from a warm cache (ADR-0019).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../o1/hardened
components:
  - ../../generated
patches:
  - target: {kind: Pod, name: o1-target}
    patch: |-
      - {op: replace, path: /spec/containers/0/imagePullPolicy, value: IfNotPresent}
      - {op: add, path: /spec/nodeSelector, value: {selfheal.lab/o1: "true"}}
  - target: {kind: Deployment}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/imagePullPolicy, value: IfNotPresent}
      - {op: add, path: /spec/template/spec/nodeSelector, value: {selfheal.lab/o1: "true"}}
