# D1 on EKS: the kind baseline without the MinIO store (ADR-0022), on
# the gp3 class the EBS CSI driver serves.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../d1/base
patches:
  - target: {kind: ConfigMap, name: d1-profile}
    patch: |-
      - op: add
        path: /data/profile
        value: baseline
  - target: {kind: StatefulSet}
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
