# Cilium on kind. Same engine as eks-network-segmentation: the quarantine
# policy for row R1 is a CiliumNetworkPolicy, and Hubble supplies the drop
# evidence that proves the isolation happened at the policy layer.
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
l7Proxy: true
agentNotReadyTaintKey: node.cilium.io/agent-not-ready
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
  # Per-node flow ring. R1 reads one pod's drops within a minute of the attack;
  # 16383 covers that with room, 65535 cost ~700 MB of agent memory on a laptop.
  eventBufferCapacity: "16383"
operator:
  replicas: 1
resources:
  requests:
    cpu: 100m
    memory: 256Mi
